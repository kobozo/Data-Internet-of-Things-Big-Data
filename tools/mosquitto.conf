# Minimal Mosquitto config for the demo.
# Mosquitto 2.0+ otherwise refuses ALL connections by default.
#
# Run with:
#   mosquitto -c tools/mosquitto.conf -v
# (the -v flag prints every connect/publish to the terminal — great for
#  the screencast).
#
# Do NOT expose this to the public internet; it has no auth.

listener 1883 0.0.0.0
allow_anonymous true

# log to stdout so we can see what happens
log_dest stdout
log_type notice
log_type warning
log_type error
log_type information

# don't persist messages to disk for this demo
persistence false
